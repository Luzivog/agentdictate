[workspace]
members = [
    "crates/agentdictate-core",
    "crates/agentdictate-runtime",
    "crates/agentdictate-linux",
    "crates/agentdictate-ui",
    "crates/agentdictate-app",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/luzivog/agentdictate"

[workspace.dependencies]
agentdictate-core = { path = "crates/agentdictate-core" }
agentdictate-runtime = { path = "crates/agentdictate-runtime" }
agentdictate-linux = { path = "crates/agentdictate-linux" }
agentdictate-ui = { path = "crates/agentdictate-ui" }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.18", features = ["serde", "v4"] }

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
