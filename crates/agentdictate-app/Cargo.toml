[package]
name = "agentdictate-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop = ["agentdictate-ui/desktop"]

[dependencies]
agentdictate-core.workspace = true
agentdictate-linux.workspace = true
agentdictate-runtime.workspace = true
agentdictate-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
libc = "0.2"
ksni = { version = "0.3.6", features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3.18"
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.23"
# Already built for the tray (ksni); the blocking API adds no crates.
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[dev-dependencies]
evdev = "0.13.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.23"

# The daemon needs no GPUI: the recording overlay runs in `agentdictate`.
[[bin]]
name = "agentdictated"
path = "src/bin/agentdictated.rs"

[[bin]]
name = "agentdictate"
path = "src/bin/agentdictate.rs"
required-features = ["desktop"]
