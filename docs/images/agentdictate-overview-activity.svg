<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title description">
  <title id="title">AgentDictate activity overview with demo data</title>
  <desc id="description">A dark activity card with fictional dictation totals and an orange thirty-day area chart.</desc>
  <defs>
    <linearGradient id="activity-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0744f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f0744f" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" rx="26" fill="#080909"/>
  <rect x="1" y="1" width="1598" height="398" rx="25" fill="#111112" stroke="#29292c"/>

  <g font-family="Inter, sans-serif" font-style="normal">
    <circle cx="36" cy="38" r="5" fill="#ef7956"/>
    <text x="54" y="45" fill="#f5f5f5" font-size="20" font-weight="600">Dictation activity</text>
    <text x="225" y="45" fill="#85858a" font-size="15">Last 30 days</text>

    <g transform="translate(1328 22)">
      <rect width="112" height="32" rx="16" fill="#1b1b1d" stroke="#303034"/>
      <text x="56" y="21" text-anchor="middle" fill="#b9b9bd" font-size="13" font-weight="600">Demo data</text>
    </g>

    <g transform="translate(36 80)">
      <text x="0" y="0" fill="#85858a" font-size="14">DICTATIONS</text>
      <text x="0" y="43" fill="#f5f5f5" font-size="31">384</text>
      <text x="182" y="0" fill="#85858a" font-size="14">WORDS</text>
      <text x="182" y="43" fill="#f5f5f5" font-size="31">17,842</text>

      <text x="0" y="104" fill="#85858a" font-size="14">DICTATION TIME</text>
      <text x="0" y="142" fill="#f5f5f5" font-size="23">131m 42s</text>
      <text x="182" y="104" fill="#85858a" font-size="14">EST. API COST</text>
      <text x="182" y="142" fill="#f5f5f5" font-size="23">$0.71</text>
    </g>

    <g transform="translate(548 78)">
      <g stroke="#29292c" stroke-width="1" stroke-dasharray="4 5">
        <line x1="0" y1="54" x2="1002" y2="54"/>
        <line x1="0" y1="126" x2="1002" y2="126"/>
        <line x1="0" y1="198" x2="1002" y2="198"/>
        <line x1="0" y1="270" x2="1002" y2="270"/>
      </g>

      <path d="M0 270 L0 235 L52 214 L104 270 L156 270 L208 270 L260 201 L312 145 L364 218 L416 264 L468 270 L520 270 L572 270 L624 172 L676 94 L728 152 L780 238 L832 259 L884 270 L936 249 L976 122 L1002 203 L1002 270 Z" fill="url(#activity-fill)"/>
      <path d="M0 235 L52 214 L104 270 L156 270 L208 270 L260 201 L312 145 L364 218 L416 264 L468 270 L520 270 L572 270 L624 172 L676 94 L728 152 L780 238 L832 259 L884 270 L936 249 L976 122 L1002 203" fill="none" stroke="#ef7956" stroke-width="2" stroke-linejoin="round"/>

      <g fill="#77777c" font-size="13">
        <text x="0" y="296">Jan 7</text>
        <text x="322" y="296">Jan 14</text>
        <text x="644" y="296">Jan 21</text>
        <text x="956" y="296">Jan 28</text>
      </g>
    </g>
  </g>
</svg>
