        <text x="53" y="20" text-anchor="middle" fill="#b9b9bd" font-size="12" font-weight="600">Demo data</text>
      </g>

      <g transform="translate(30 80)">
        <text x="0" y="0" fill="#85858a" font-size="12">DICTATIONS</text>
        <text x="0" y="35" fill="#f5f5f5" font-size="28">384</text>
        <text x="150" y="0" fill="#85858a" font-size="12">WORDS</text>
        <text x="150" y="35" fill="#f5f5f5" font-size="28">17,842</text>
      </g>

