<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">AgentDictate social preview</title>
  <desc id="description">AgentDictate Linux dictation through a Codex subscription, separated from an orange activity graph.</desc>
  <defs>
    <linearGradient id="preview-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0744f" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#f0744f" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#080909"/>
  <g font-family="Inter, sans-serif" font-style="normal">
    <g transform="translate(0 78)">
      <g transform="translate(72 74)">
        <rect width="58" height="58" rx="15" fill="#171719" stroke="#343438"/>
        <g transform="translate(0 -4)">
          <rect x="23" y="13" width="12" height="22" rx="6" fill="none" stroke="#f5f5f5" stroke-width="3"/>
          <path d="M17 31c0 9 5 14 12 14s12-5 12-14M29 45v8M22 53h14" fill="none" stroke="#f5f5f5" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="78" y="40" fill="#f5f5f5" font-size="34" font-weight="600">AgentDictate</text>
      </g>

      <text x="72" y="222" fill="#f5f5f5" font-size="52" font-weight="600">STT with your</text>
      <text x="72" y="282" fill="#f5f5f5" font-size="52" font-weight="600">Codex subscription</text>
      <text x="72" y="334" fill="#9a9a9f" font-size="23">Push to talk. Paste into the focused app.</text>

      <g transform="translate(72 405)">
        <circle cx="6" cy="-7" r="5" fill="#ef7956"/>
        <text x="22" y="0" fill="#c8c8cb" font-size="20">No API key · Wayland · X11</text>
      </g>
    </g>

    <line x1="650" y1="64" x2="650" y2="576" stroke="#29292c"/>

    <g transform="translate(690 120)">
      <circle cx="30" cy="34" r="5" fill="#ef7956"/>
      <text x="47" y="41" fill="#f5f5f5" font-size="18" font-weight="600">Dictation activity</text>

      <g transform="translate(30 80)">
        <text x="0" y="0" fill="#85858a" font-size="12">DICTATION TIME</text>
        <text x="0" y="35" fill="#f5f5f5" font-size="28">6h 24m</text>
        <text x="150" y="0" fill="#85858a" font-size="12">WORDS</text>
        <text x="150" y="35" fill="#f5f5f5" font-size="28">17,842</text>
      </g>

      <g transform="translate(30 166)">
        <g stroke="#29292c" stroke-width="1" stroke-dasharray="4 5">
          <line x1="0" y1="44" x2="458" y2="44"/>
          <line x1="0" y1="103" x2="458" y2="103"/>
          <line x1="0" y1="162" x2="458" y2="162"/>
        </g>
        <path d="M0 180 L0 155 L28 140 L57 180 L86 180 L114 180 L143 121 L172 82 L200 148 L229 176 L258 180 L286 180 L315 112 L344 48 L372 88 L401 156 L430 138 L458 72 L458 180 Z" fill="url(#preview-fill)"/>
        <path d="M0 155 L28 140 L57 180 L86 180 L114 180 L143 121 L172 82 L200 148 L229 176 L258 180 L286 180 L315 112 L344 48 L372 88 L401 156 L430 138 L458 72" fill="none" stroke="#ef7956" stroke-width="2" stroke-linejoin="round"/>
        <g fill="#77777c" font-size="11">
          <text x="0" y="205">Jan 7</text>
          <text x="205" y="205">Jan 14</text>
          <text x="420" y="205">Jan 28</text>
        </g>
      </g>
    </g>
  </g>
</svg>
