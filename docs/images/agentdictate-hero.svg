<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">AgentDictate workflow</title>
  <desc id="description">Press Control Space, speak while the recording waveform is visible, then receive the transcript at the active cursor.</desc>
  <rect width="1600" height="640" rx="28" fill="#080909"/>

  <g font-family="Inter" font-style="normal">
    <text x="70" y="78" fill="#f5f5f5" font-size="34" font-weight="600">Dictate without breaking focus</text>
    <text x="70" y="116" fill="#929296" font-size="20">One shortcut. Your voice. The focused app.</text>

    <g transform="translate(70 154)">
      <rect width="430" height="418" rx="24" fill="#111112" stroke="#29292c"/>
      <circle cx="36" cy="38" r="5" fill="#f04a1f"/>
      <text x="54" y="45" fill="#f5f5f5" font-size="22" font-weight="600">Start</text>
      <text x="34" y="82" fill="#8f8f93" font-size="17">Use the global shortcut</text>

      <g transform="translate(48 155)">
        <rect width="136" height="82" rx="17" fill="#1b1b1d" stroke="#3a3a3e"/>
        <text x="68" y="52" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="600">Ctrl</text>
        <text x="167" y="51" text-anchor="middle" fill="#747479" font-size="28">+</text>
        <rect x="196" width="138" height="82" rx="17" fill="#1b1b1d" stroke="#3a3a3e"/>
        <text x="265" y="52" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="600">Space</text>
      </g>

      <text x="215" y="304" text-anchor="middle" fill="#f5f5f5" font-size="22">Press the shortcut to record</text>
      <text x="215" y="337" text-anchor="middle" fill="#85858a" font-size="17">Your current app keeps focus</text>
    </g>

    <g transform="translate(585 154)">
      <rect width="430" height="418" rx="24" fill="#111112" stroke="#29292c"/>
      <circle cx="36" cy="38" r="5" fill="#67c98a"/>
      <text x="54" y="45" fill="#f5f5f5" font-size="22" font-weight="600">Speak</text>
      <text x="34" y="82" fill="#8f8f93" font-size="17">A focus-neutral overlay confirms recording</text>

      <g transform="translate(55 147) scale(2.52)">
        <rect x="6" y="8" width="127" height="42" rx="14" fill="#000000" opacity="0.24"/>
        <rect x="6" y="6" width="127" height="42" rx="14" fill="#111112" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
        <g fill="#f04a1f">
          <rect x="18" y="24" width="2.4" height="6" rx="1.2" opacity="0.52"/>
          <rect x="22" y="21" width="2.4" height="12" rx="1.2" opacity="0.65"/>
          <rect x="26" y="17" width="2.4" height="20" rx="1.2" opacity="0.79"/>
          <rect x="30" y="13" width="2.4" height="28" rx="1.2" opacity="0.92"/>
          <rect x="34" y="18" width="2.4" height="18" rx="1.2" opacity="0.76"/>
          <rect x="38" y="22" width="2.4" height="10" rx="1.2" opacity="0.61"/>
          <rect x="42" y="19" width="2.4" height="16" rx="1.2" opacity="0.72"/>
          <rect x="46" y="14" width="2.4" height="26" rx="1.2" opacity="0.88"/>
          <rect x="50" y="10" width="2.4" height="34" rx="1.2" opacity="0.97"/>
          <rect x="54" y="16" width="2.4" height="22" rx="1.2" opacity="0.82"/>
          <rect x="58" y="20" width="2.4" height="14" rx="1.2" opacity="0.69"/>
          <rect x="62" y="23" width="2.4" height="8" rx="1.2" opacity="0.56"/>
          <rect x="66" y="19" width="2.4" height="16" rx="1.2" opacity="0.72"/>
          <rect x="70" y="15" width="2.4" height="24" rx="1.2" opacity="0.85"/>
          <rect x="74" y="18" width="2.4" height="18" rx="1.2" opacity="0.76"/>
          <rect x="78" y="22" width="2.4" height="10" rx="1.2" opacity="0.61"/>
          <rect x="82" y="20" width="2.4" height="14" rx="1.2" opacity="0.69"/>
          <rect x="86" y="17" width="2.4" height="20" rx="1.2" opacity="0.79"/>
          <rect x="90" y="21" width="2.4" height="12" rx="1.2" opacity="0.65"/>
          <rect x="94" y="24" width="2.4" height="6" rx="1.2" opacity="0.52"/>
        </g>
        <text x="102" y="31" fill="#f5f5f5" fill-opacity="0.94" font-size="13" font-weight="700">0:08</text>
      </g>

      <text x="215" y="304" text-anchor="middle" fill="#f5f5f5" font-size="22">Know when recording is active</text>
      <text x="215" y="337" text-anchor="middle" fill="#85858a" font-size="17">Press again or release when finished</text>
    </g>

    <g transform="translate(1100 154)">
      <rect width="430" height="418" rx="24" fill="#111112" stroke="#29292c"/>
      <circle cx="36" cy="38" r="5" fill="#65bde2"/>
      <text x="54" y="45" fill="#f5f5f5" font-size="22" font-weight="600">Paste</text>
      <text x="34" y="82" fill="#8f8f93" font-size="17">The transcript arrives at your cursor</text>

      <g transform="translate(34 126)">
        <rect width="362" height="154" rx="15" fill="#0b0b0c" stroke="#2d2d30"/>
        <circle cx="24" cy="23" r="4" fill="#48484d"/>
        <circle cx="40" cy="23" r="4" fill="#48484d"/>
        <circle cx="56" cy="23" r="4" fill="#48484d"/>
        <rect x="22" y="50" width="198" height="8" rx="4" fill="#2b2b2e"/>
        <text x="22" y="93" fill="#f5f5f5" font-size="19">Ship ideas while they are fresh.</text>
        <rect x="286" y="74" width="2" height="24" rx="1" fill="#f04a1f"/>
        <rect x="22" y="119" width="268" height="7" rx="3.5" fill="#242427"/>
      </g>

      <text x="215" y="325" text-anchor="middle" fill="#f5f5f5" font-size="22">Keep working where you started</text>
      <text x="215" y="358" text-anchor="middle" fill="#85858a" font-size="17">The transcript also stays on the clipboard</text>
    </g>

    <g fill="none" stroke="#55555a" stroke-width="2">
      <path d="M526 363h28"/>
      <path d="m546 355 8 8-8 8"/>
      <path d="M1041 363h28"/>
      <path d="m1061 355 8 8-8 8"/>
    </g>
  </g>
</svg>
