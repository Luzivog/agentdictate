[project]
name = "agentdictate"
version = "0.1.0"
description = "Personal Linux push-to-talk dictation app for AI coding prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
agentdictate = "agentdictate.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
