name: Release

# Tag-gated packaging only. This workflow never runs on ordinary pushes or
# pull requests, and GitHub Actions on this public repository do not consume
# usage minutes for standard runners.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # rustup's threaded downloader can die with SIGPIPE (exit 141) while
  # fetching toolchain components on hosted runners.
  RUSTUP_IO_THREADS: "1"

jobs:
  package:
    name: Package ${{ github.ref_name }}
    # The AppImage needs the glibc of the runner it was built on, so pin it
    # instead of following ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev

      # Install the rust-toolchain.toml pin up front so download failures are
      # isolated from the packaging steps.
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      # Runners can create uinput devices but expose no grabbable event nodes
      # and have no keyboards; the tests that need them skip themselves.
      # --no-fail-fast reports every failing target in one run.
      - name: Test
        run: cargo test --locked --workspace --all-features --no-fail-fast

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      # appimagetool 1.9.1 and the type2 runtime it embeds, both pinned by
      # checksum; appimagetool would otherwise fetch the newest runtime.
      - name: Download pinned AppImage tools
        run: |
          mkdir -p dist/tools
          curl -fsSL -o dist/tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o dist/tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<'EOF'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  dist/tools/appimagetool-x86_64.AppImage
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  dist/tools/runtime-x86_64
          EOF
          chmod 0755 dist/tools/appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_RUNTIME: dist/tools/runtime-x86_64
        run: ./packaging/build-appimage.sh

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.AppImage
