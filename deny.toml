# cargo-deny configuration: advisories, licenses, and duplicate detection.
# Run with `cargo deny check` (install: cargo install cargo-deny --locked).

# Audit what ships: every feature (the desktop binaries need them) on the
# Linux targets AgentDictate supports.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates that only GPUI (gpui-pre) and gpui-component pull in,
# and only into the desktop binary. None has a known vulnerability; each goes
# away when those crates update.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant: via gpui-base and gpui-component" },
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time macro used by gpui-component" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: GPUI text shaping via cosmic-text and usvg" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: GPUI font parsing via cosmic-text, fontdb and usvg" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Permissive BSD-style: libbz2-rs-sys, via GPUI's HTTP client decompression.
  "bzip2-1.0.6",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace inheritance (`foo.workspace = true`) registers as a wildcard.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
